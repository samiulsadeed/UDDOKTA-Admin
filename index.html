.k-badge{border-radius:99px;padding:1px 10px;font-size:11px;font-weight:600}
.k-note{margin-top:4px;font-size:13px;color:var(--mut)}
.k-act{display:flex;gap:8px;flex:none}
.evrow{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:10px;margin-top:8px}.evrow i{width:12px;height:12px;border-radius:50%;flex:none;margin-top:4px}
@media(max-width:700px){.cc{min-height:64px;padding:4px}.cev{font-size:10px;padding:1px 3px}.cw{padding:8px 2px;font-size:10px}.k-item{flex-wrap:wrap}.chl h2{font-size:22px}}</style>`;
function calOpen(html){$('#ov').innerHTML=html;$('#ov').className='ov on';$('#ov').onclick=e=>{if(e.target.id==='ov')close()}}
function calDay(key){
 const list=M.calendar.rows.filter(e=>e.date===key).sort(evSort);
 const lab=new Date(key+'T00:00:00').toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
 calOpen(`<div class="drawer"><button class="btn" id="x" style="float:right">Close</button><h2>${lab}</h2>
 <div style="margin-top:12px"><button class="btn p" id="dn">+ Add event on this day</button></div>
 ${list.map(e=>`<button class="evrow" data-e="${e.id}"><i style="background:${evColor(e)}"></i><span><b>${esc(e.title)}</b><br><span class="lbl">${esc(e.type)}${e.time?' · '+t12(e.time):''} · ${esc(e.who)}</span>${e.note?`<br><span>${esc(e.note)}</span>`:''}</span></button>`).join('')||'<p class="lbl" style="margin-top:14px">No events on this day.</p>'}</div>`);
 $('#x').onclick=close;$('#dn').onclick=()=>calEv(null,key);
 document.querySelectorAll('#ov [data-e]').forEach(b=>b.onclick=()=>calEv(b.dataset.e))}
function calEv(id,date){
 const ev=id?M.calendar.rows.find(x=>x.id==id):null;if(id&&!ev)return;
 const v=ev||{title:'',date:date||lnow(),time:'',type:'Meeting',who:tn[0],note:'',color:''};
 let touched=!!(ev&&ev.color&&ev.color.toLowerCase()!==(CCAT[ev.type]||'').toLowerCase());
 const cats=Object.keys(CCAT);if(!cats.includes(v.type))cats.push(v.type);
 calOpen(`<div class="drawer"><h2>${ev?'Edit event':'Note event / work'}</h2><form id="ef" style="display:grid;gap:12px;margin-top:14px">
 <label class="lbl">Event title<input class="in" name="title" required value="${esc(v.title)}"></label>
 <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px"><label class="lbl">Date<input class="in" name="date" type="date" required value="${esc(v.date)}"></label>
 <label class="lbl">Time<input class="in" name="time" type="time" value="${esc(v.time)}"></label></div>
 <label class="lbl">Category<select class="in" name="type">${cats.map(k=>`<option value="${esc(k)}" ${k===v.type?'selected':''}>${CEMO[k]||'⚪'} ${esc(k)}</option>`).join('')}</select></label>
 <label class="lbl">Colour (follows the category unless you pick your own)<input class="in" name="color" type="color" value="${evColor(v)}" style="height:40px;padding:3px"></label>
 <label class="lbl">Person<select class="in" name="who">${tn.map(n=>`<option ${n===v.who?'selected':''}>${esc(n)}</option>`).join('')}</select></label>
 <label class="lbl">Notes<textarea class="in" name="note" rows="5" placeholder="Add notes for this event…">${esc(v.note)}</textarea></label>
 <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn p">Save</button><button type="button" class="btn" id="cx">Cancel</button>${ev?'<button type="button" class="btn" id="dl" style="margin-left:auto">Delete</button>':''}</div></form></div>`);
 const f=$('#ef');f.elements.title.focus();
 $('#cx').onclick=close;
 f.elements.type.onchange=()=>{if(!touched&&CCAT[f.elements.type.value])f.elements.color.value=CCAT[f.elements.type.value]};
 f.elements.color.oninput=()=>{touched=true};
 if(ev)$('#dl').onclick=()=>{if(!confirm('Delete this event?'))return;M.calendar.rows=M.calendar.rows.filter(x=>x.id!=ev.id);close();toast('Event deleted');cal()};
 f.onsubmit=e=>{e.preventDefault();const n={title:f.elements.title.value.trim(),date:f.elements.date.value,time:f.elements.time.value,type:f.elements.type.value,who:f.elements.who.value,note:f.elements.note.value.trim(),color:f.elements.color.value};
  if(!n.title||!n.date)return;
  if(ev)Object.assign(ev,n);else M.calendar.rows.push({id:uid(),...n});
  const d=new Date(n.date+'T00:00:00');S.cy=d.getFullYear();S.cm=d.getMonth();
  if(S.ccat&&S.ccat!==n.type)S.ccat='';
  close();toast(ev?'Event updated':'Event added');cal()}}
function cal(){
 M.calendar.rows.forEach(e=>{if(e.type==='Internal')e.type='Internal Sync'});
 const t=new Date();if(S.cy==null){S.cy=t.getFullYear();S.cm=t.getMonth()}
 if(S.ccat==null)S.ccat='';
 const y=S.cy,mo=S.cm,lead=new Date(y,mo,1).getDay(),dim=new Date(y,mo+1,0).getDate(),pdim=new Date(y,mo,0).getDate(),tdy=lnow(),cells=Math.ceil((lead+dim)/7)*7;
 const all=M.calendar.rows,cats=[...new Set([...Object.keys(CCAT),...all.map(e=>e.type)])];
 if(S.ccat&&!cats.includes(S.ccat))S.ccat='';
 const vis=all.filter(e=>!S.ccat||e.type===S.ccat),by={};
 vis.forEach(e=>(by[e.date]=by[e.date]||[]).push(e));
 let g=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(d=>`<div class="cw">${d}</div>`).join('');
 for(let i=0;i<cells;i++){const d=i-lead+1;
  if(d<1){g+=`<div class="cc off"><div class="ctop"><span class="cd">${pdim+d}</span></div></div>`;continue}
  if(d>dim){g+='<div class="cc off"></div>';continue}
  const key=ymd(y,mo,d),list=(by[key]||[]).slice().sort(evSort);
  g+=`<div class="cc${key===tdy?' td':''}" data-day="${key}" tabindex="0" aria-label="${d} ${MN[mo]}, ${list.length} events"><div class="ctop"><span class="cd">${d}</span>${list.length?`<span class="cb">${list.length}</span>`:''}</div>${list.slice(0,3).map(e=>`<button class="cev" data-e="${e.id}" style="background:${evColor(e)};color:${evInk(evColor(e))}" title="${esc(e.title)}${e.note?' — '+esc(e.note):''}">${e.time?esc(e.time)+' ':''}${esc(e.title)}</button>`).join('')}${list.length>3?`<div class="more">+${list.length-3} more</div>`:''}</div>`}
 const items=vis.slice().sort((a,b)=>String(a.date).localeCompare(b.date)||evSort(a,b));
 $('#view').innerHTML=`${calStyle}<div class="ch"><div class="chl"><h2>${MN[mo]} ${y}</h2><button class="btn" id="cp">← Prev</button><button class="btn" id="ct">Today</button><button class="btn" id="cn">Next →</button></div><button class="btn cnew" id="cnew">+ Note Event / Work</button></div>
 <div class="cwrap"><div class="cg" id="cgrid">${g}</div></div>
 <div class="kc"><div class="kh"><h3>📁 Scheduled Work Categories &amp; Noted Items</h3><span class="ktot">${all.length} Total Events Noted</span></div>
 <div class="chips" role="group" aria-label="Filter by category"><button class="chip${!S.ccat?' on':''}" data-cc="">🌐 All Categories (${all.length})</button>${cats.map(k=>`<button class="chip${S.ccat===k?' on':''}" data-cc="${esc(k)}" style="--cc:${CCAT[k]||'#6b7488'}">${CEMO[k]||'⚪'} ${esc(k)} (${all.filter(e=>e.type===k).length})</button>`).join('')}</div>
 <div class="kl" id="klist">${items.map(e=>{const c=evColor(e),tm=t12(e.time);return `<div class="k-item" style="border-left-color:${c}">${av(e.who)}<div class="k-body"><b class="k-t">${esc(e.title)}</b><div class="k-meta"><span class="k-badge" style="background:${c};color:${evInk(c)}">${CEMO[e.type]||'⚪'} ${esc(e.type)}</span><span>📅 ${esc(e.date)}${tm?' at '+tm:''} · With <b>${esc(e.who)}</b></span></div>${e.note?`<div class="k-note">📝 ${esc(e.note)}</div>`:''}</div><div class="k-act"><button class="btn" data-edit="${e.id}">Edit</button><button class="btn" data-del="${e.id}" aria-label="Delete event">✕</button></div></div>`}).join('')||'<p class="lbl">No events in this category yet. Use “+ Note Event / Work”.</p>'}</div></div>`;
 $('#cp').onclick=()=>{S.cm--;if(S.cm<0){S.cm=11;S.cy--}cal()};
 $('#cn').onclick=()=>{S.cm++;if(S.cm>11){S.cm=0;S.cy++}cal()};
 $('#ct').onclick=()=>{S.cy=t.getFullYear();S.cm=t.getMonth();cal()};
 $('#cnew').onclick=()=>calEv(null,(S.cy===t.getFullYear()&&S.cm===t.getMonth())?tdy:ymd(y,mo,1));
 document.querySelectorAll('[data-cc]').forEach(b=>b.onclick=()=>{S.ccat=b.dataset.cc;cal()});
 $('#klist').onclick=e=>{const ed=e.target.closest('[data-edit]');if(ed)return calEv(ed.dataset.edit);const dl=e.target.closest('[data-del]');if(dl){if(!confirm('Delete this event?'))return;M.calendar.rows=M.calendar.rows.filter(x=>x.id!=dl.dataset.del);toast('Event deleted');cal()}};
 const grid=$('#cgrid');
 grid.onclick=e=>{const p=e.target.closest('.cev');if(p)return calEv(p.dataset.e);const c=e.target.closest('.cc[data-day]');if(c)calDay(c.dataset.day)};
 grid.onkeydown=e=>{if(e.key==='Enter'&&e.target.classList.contains('cc')&&e.target.dataset.day)calDay(e.target.dataset.day)}}

/* ---- Role management: Managing Director only (added) ---- */
const RM_ROLES=['Chairman','Managing Director','Marketing Head','R&D','Creative Head'];
const RM_PAGES=nav.filter(n=>n[0]!=='roles');
async function syncPerms(){try{const r=await fetch('/api/perms');if(!r.ok)return false;const p=await r.json();if(JSON.stringify(p)===JSON.stringify(perms))return false;for(const k in perms)delete perms[k];Object.assign(perms,p);return true}catch(e){return false}}
function rl(){
if(!can('roles')){$('#view').innerHTML='<div class="card" style="text-align:center;padding:40px"><h3 style="justify-content:center">Access restricted</h3><p class="lbl">Only the Managing Director can open Role management.</p></div>';return}
const cnt=r=>perms[r]==='all'?RM_PAGES.length:perms[r].length;
$('#view').innerHTML=`<style>.rmg{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;margin-top:6px}.rmk{display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:9px 10px;cursor:pointer;min-height:40px}.rmk input{width:17px;height:17px;accent-color:var(--acc2);flex:none}.rmk.lock{opacity:.7;cursor:default}</style>
<p class="lbl" style="margin:0 0 14px;max-width:760px">Only you (Managing Director) can see this page. Each card is a category. Tick the pages that category is allowed to open; unticked pages are hidden from them. Example: to show R&amp;D Lab only to Creative Head, tick R&amp;D Lab on the Creative Head card and untick it on the other cards. Changes save as soon as you tick, and reach everyone within a few seconds.</p>
<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(300px,1fr))">${RM_ROLES.map(r=>{const md=r==='Managing Director',p=perms[r];return `<div class="card" data-r="${esc(r)}"><h3>${esc(r)} <span class="pill ${md?'ok':'ac'}" data-n>${md?'Full access · fixed':cnt(r)+' of '+RM_PAGES.length+' pages'}</span></h3><div class="rmg">${RM_PAGES.map(([k,l])=>`<label class="rmk${md?' lock':''}"><input type="checkbox" data-p="${k}" ${md||p==='all'||p.includes(k)?'checked':''} ${md?'disabled':''}><span>${l}</span></label>`).join('')}</div></div>`}).join('')}</div>`;
document.querySelectorAll('#view .card[data-r]').forEach(card=>{const role=card.dataset.r;if(role==='Managing Director')return;
card.onchange=async e=>{if(!e.target.dataset.p)return;const list=[...card.querySelectorAll('[data-p]')].filter(x=>x.checked).map(x=>x.dataset.p);
try{const r=await fetch('/api/roles-access',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({role,perms:list})});
if(!r.ok){const d=await r.json().catch(()=>({}));toast(d.error||'Could not save');rl();return}
await syncPerms();card.querySelector('[data-n]').textContent=cnt(role)+' of '+RM_PAGES.length+' pages';toast('Saved: '+role)}
catch(x){toast('Cannot reach the server');rl()}}})}
setInterval(()=>{const a=document.activeElement&&document.activeElement.tagName;if($('#ov').classList.contains('on')||a==='INPUT'||a==='SELECT'||a==='TEXTAREA')return;syncPerms().then(ch=>{if(ch){if(!can(S.v))S.v='dash';render()}})},15000);
const snap=()=>JSON.stringify({rows:Object.fromEntries(Object.entries(M).map(([k,m])=>[k,m.rows])),leads,clients,info,follow});
function apply(d){for(const k in d.rows)if(M[k])M[k].rows=d.rows[k];leads.splice(0,leads.length,...d.leads);clients.splice(0,clients.length,...d.clients);if(d.info)info.splice(0,info.length,...d.info);if(d.follow)follow.splice(0,follow.length,...d.follow);if(!d.info||!d.follow)setTimeout(()=>{last='';save()},0)}
let last='';
function save(){try{const b=snap();if(b===last)return;last=b;fetch('/api/state',{method:'PUT',headers:{'Content-Type':'application/json'},body:b}).catch(()=>{})}catch(e){}}
async function pull(){try{const r=await fetch('/api/state');if(!r.ok)return false;const d=await r.json();if(!d.rows||JSON.stringify(d)===snap())return false;apply(d);last=snap();return true}catch(e){return false}}
render();pull().then(c=>c&&render());
setInterval(()=>{const a=document.activeElement&&document.activeElement.tagName;if($('#ov').classList.contains('on')||a==='INPUT'||a==='SELECT')return;pull().then(c=>c&&render())},6000);
</script><script>
/* login guard + log out button (added) */
fetch('/api/me').then(r=>{if(!r.ok)location.href='/login';return r.json()}).then(m=>{if(!m||!m.username)return;
const b=document.createElement('button');b.textContent='Log out ('+m.username+')';
b.style.cssText='position:fixed;left:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:9;font:12px inherit;padding:6px 10px;border-radius:9px;border:1px solid var(--line);background:var(--panel);color:var(--mut);cursor:pointer';
b.onclick=()=>fetch('/api/logout',{method:'POST'}).then(()=>location.href='/login');document.body.appendChild(b)}).catch(()=>{});
</script>
</body></html>
